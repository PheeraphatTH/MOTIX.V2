<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <!-- 3D Chrome Gradient -->
    <linearGradient id="motixChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="52%" stop-color="#334155" />
      <stop offset="78%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Ruby Red Performance Gradient -->
    <linearGradient id="motixRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="40%" stop-color="#E63946" />
      <stop offset="80%" stop-color="#9A031E" />
      <stop offset="100%" stop-color="#4A000A" />
    </linearGradient>

    <filter id="motixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E63946" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Background Pill for High Contrast -->
  <rect x="0" y="0" width="460" height="110" rx="16" fill="#0B0E17" stroke="#222C3E" stroke-width="2"/>

  <!-- Left Emblem (RPM Arc + Sports Car Silhouette) -->
  <g transform="translate(18, 12)">
    <!-- Tachometer RPM Arc (Dotted Background) -->
    <path d="M 32 60 A 52 52 0 0 1 128 60" fill="none" stroke="#263248" stroke-width="4.5" stroke-dasharray="4 4"/>
    <!-- Redline High RPM Zone -->
    <path d="M 88 23 A 52 52 0 0 1 126 58" fill="none" stroke="url(#motixRed)" stroke-width="6" filter="url(#motixGlow)"/>
    <!-- Tachometer Needle -->
    <line x1="80" y1="56" x2="108" y2="28" stroke="#FF4D4D" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="80" cy="56" r="4.5" fill="#E2E8F0" stroke="#0F172A" stroke-width="2"/>
    <!-- Sports Coupe Car Silhouette Roofline in Chrome -->
    <path d="M 12 56 C 28 54, 48 32, 78 31 C 106 30, 124 44, 148 56" fill="none" stroke="url(#motixChrome)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 36 52 C 54 37, 74 36, 94 36 C 108 36, 118 44, 132 52" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Speed horizontal cut line -->
    <line x1="8" y1="60" x2="152" y2="60" stroke="#E63946" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography: MOTI + X -->
  <g transform="translate(185, 62)">
    <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#motixChrome)" letter-spacing="-1">MOTI</text>
    <text x="116" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="44" fill="url(#motixRed)" filter="url(#motixGlow)">X</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(187, 86)">
    <text font-family="Arial, Helvetica, sans-serif" font-weight="800" font-style="italic" font-size="12" fill="#94A3B8" letter-spacing="2">KEEP YOUR RIDE MOVING.</text>
  </g>
</svg>
